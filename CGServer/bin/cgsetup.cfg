# cg-streamer 송출 설정 ("키=값", '#' 이후는 주석)
# HDMI 입력(RX)은 자동 감지되므로 여기서 설정하지 않음.

# output: 1=HDMI만(로컬 출력, 인코딩/UDP 없음)  2=UDP만(기본)  3=HDMI+UDP 동시
output=3

# 모니터가 두 대 연결되어 있을 때 어디에 무엇을 보여 줄지 (bin/display.sh 가 읽음)
#   editor_display : 에디터(Chromium 키오스크)를 띄울 모니터 (기본 HDMI-1, 왼쪽)
#   output_display : 송출 화면(cg-streamer 미리보기)과 로컬 음성을 내보낼 모니터 (기본 HDMI-2). 이 모니터만 제어하며 다른 모니터(HDMI-1 등)는 건드리지 않음
# 한 대만 연결되어 있으면 그 모니터를 둘이 함께 씀.
editor_display=HDMI-1
output_display=HDMI-2
# editor_scale: 에디터(키오스크) 화면 배율. auto(기본)=모니터가 1600x900 보다 작으면 그 비율로 축소(1024x600 -> 0.64)해서 패널이 잘리지 않게 함,
#   숫자(예: 0.7)=그 배율로 고정, 1=축소 안 함. 바꾼 뒤 bin/kiosk.sh restart.
editor_scale=auto

# editor_kiosk: on 이면 start.sh 가 에디터를 Chromium 키오스크로 editor_display 모니터에 띄움. off(기본)면 띄우지 않음 -> 에디터는 데스크탑에서 브라우저로 직접 접속.
editor_kiosk=off

# realtime: on 이면 인코딩/표시/음성 스레드를 SCHED_FIFO(실시간)로 올림(limits.d 에 rtprio 권한 필요). off(기본)면 일반 스케줄링.
#   프레임 간격이 흔들릴 때만 켜고, 켠 뒤 마우스/데스크탑이 느려지면 다시 off.
realtime=off

# UDP 송출 목적지 (output=2 또는 3일 때 사용)
#udp_ip=10.10.10.45
udp_ip=192.168.0.3
udp_port=1234

# fps: 인코더(rc)/EncodeLoop 틱/CEF 페인트 fps 공통 기본값 (기본 60)
fps=60

# editor_port: cg-editor(웹 편집기) 접속 포트. start.sh/stop.sh 가 읽어 에디터 실행·종료·키오스크 주소에 사용 (cg-streamer 는 무시).
# 우선순위: 환경변수 CG_EDITOR_PORT > 이 값 > cg-editor/.env.production > 5173
editor_port=8080

# audio_out: output=3(HDMI+UDP)일 때 송출과 같은 음성을 로컬 HDMI 로도 재생.
#   auto(기본)=연결된 HDMI 커넥터의 소리 카드(HDMI-A-1→rockchiphdmi0, HDMI-A-2→rockchiphdmi1) / off=끔 / ALSA 장치명(예: plughw:CARD=rockchiphdmi1,DEV=0)
audio_out=auto
